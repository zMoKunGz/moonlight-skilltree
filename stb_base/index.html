<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Tree Builder</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { display: flex; align-items: center; justify-content: center; overflow: auto; }
.home {
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; padding: 60px 20px; text-align: center;
}
.home-logo {
  font-family: var(--font-head); font-size: 42px; font-weight: 700;
  color: var(--gold); letter-spacing: .12em; line-height: 1;
  margin-bottom: 8px;
}
.home-sub { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
.home-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.home-card {
  width: 240px; padding: 28px 24px; border-radius: var(--radius-lg);
  background: var(--bg2); border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-decoration: none; transition: all .18s; cursor: pointer;
}
.home-card:hover { border-color: var(--accent); background: var(--bg3); transform: translateY(-2px); }
.home-card.gold-card:hover { border-color: var(--gold); }
.home-card .card-icon { font-size: 36px; }
.home-card .card-title {
  font-family: var(--font-head); font-size: 18px; font-weight: 700;
  color: var(--text); letter-spacing: .06em;
}
.home-card .card-desc { font-size: 12px; color: var(--text2); line-height: 1.6; text-align: center; }
.home-footer { margin-top: 32px; font-size: 11px; color: var(--text3); }
</style>
</head>
<body>
<div class="home">
  <div class="home-logo">⬡ SKILL TREE</div>
  <div class="home-sub">Passive Tree Builder &amp; Simulator</div>
  <div class="home-cards">
    <a class="home-card gold-card" href="editor.html">
      <div class="card-icon">✏️</div>
      <div class="card-title">Editor</div>
      <div class="card-desc">สร้างและแก้ไข passive tree<br>วาง node · กำหนด stat · เชื่อม path</div>
    </a>
    <a class="home-card" href="simulator.html">
      <div class="card-icon">⚔️</div>
      <div class="card-title">Simulator</div>
      <div class="card-desc">จำลองการอัพสกิล<br>ดู stat รวม real-time</div>
    </a>
  </div>
  <div class="home-footer">Tree data บันทึกใน browser — ใช้ Export JSON เพื่อสำรองข้อมูล</div>
</div>
</body>
</html>
