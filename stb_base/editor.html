<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor — Skill Tree Builder</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/editor.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
  <a href="index.html" class="logo">⬡ STB</a>
  <div class="sep"></div>
  <input type="text" id="tree-name-input" value="Untitled Tree"
    style="width:180px;background:transparent;border-color:transparent;font-family:var(--font-head);font-size:14px;font-weight:600;color:var(--text)">
  <div class="sep"></div>
  <span id="save-status"></span>
  <div class="spacer"></div>
  <button class="btn sm" id="btn-import">📂 Import</button>
  <button class="btn sm" id="btn-export">💾 Export JSON</button>
  <button class="btn sm gold" id="btn-export-mmo">⚔ Export MMOCore</button>
  <button class="btn sm primary" id="btn-save">✓ Save</button>
  <div class="sep"></div>
  <a href="simulator.html" class="btn sm gold">▶ Simulator</a>
</div>

<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <div class="tool-group">
      <button class="tool-btn active" id="tool-select" title="เลือก node (Esc)">✥</button>
      <button class="tool-btn" id="tool-place" title="วาง node (P)">＋</button>
      <button class="tool-btn" id="tool-connect" title="เชื่อม path (C)">⇢</button>
    </div>
    <div class="tool-group">
      <button class="btn sm danger" id="btn-delete" title="ลบ node ที่เลือก (Del)">🗑 ลบ</button>
    </div>
    <div class="tool-group">
      <button class="btn sm" id="btn-new">🆕 ใหม่</button>
      <button class="btn sm" id="btn-reset-view" title="รีเซ็ต view">⊙ Reset view</button>
    </div>
    <span class="tool-label">Pan: Alt+drag หรือ ปุ่มกลาง · Zoom: scroll</span>
  </div>

  <div id="editor-layout">
    <!-- Canvas -->
    <div id="canvas-wrap">
      <div id="origin-mark" class="origin-mark"></div>
      <div id="origin-label" class="origin-label">0,0</div>
      <svg id="tree-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:5;"></svg>
      <div id="canvas"></div>
    </div>

    <!-- Right Panel -->
    <div id="right-panel">
      <!-- Empty state -->
      <div id="panel-empty" class="empty-state" style="flex:1">
        <div class="icon">◎</div>
        <div>เลือก node เพื่อแก้ไข</div>
        <div style="font-size:11px;color:var(--text3)">หรือกด ＋ เพื่อวาง node ใหม่</div>
      </div>

      <!-- Node editor (hidden until node selected) -->
      <div id="panel-node" style="display:none">
        <div class="panel-section">
          <h3>Node</h3>
          <div class="row">
            <label>ชื่อ Node</label>
            <div style="display:flex;gap:6px">
              <input type="text" id="node-label-input" placeholder="ชื่อ node..." style="flex:1">
              <button class="btn sm gold icon-only" id="btn-randomize-name" title="สุ่มชื่อ node">🎲</button>
            </div>
          </div>
          <div class="row">
            <label>ประเภท</label>
            <div class="type-toggle">
              <button class="type-btn active normal" data-type="normal">Normal</button>
              <button class="type-btn keystone" data-type="keystone">Keystone</button>
            </div>
          </div>

          <div class="row">
            <label>Icon</label>
            <div id="icon-grid"></div>
          </div>

          <div class="row">
            <label>สี Node (MMOCore)</label>
            <div id="mmo-color-picker" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">
              <button class="mmo-color-btn" data-color="red"    style="background:#c0392b;border-color:#e74c3c">Red</button>
              <button class="mmo-color-btn" data-color="green"  style="background:#27ae60;border-color:#2ecc71">Green</button>
              <button class="mmo-color-btn" data-color="pink"   style="background:#8e44ad;border-color:#e91e8c">Pink</button>
              <button class="mmo-color-btn" data-color="blue"   style="background:#2980b9;border-color:#3498db">Blue</button>
              <button class="mmo-color-btn" data-color="yellow" style="background:#f39c12;border-color:#f1c40f">Yellow</button>
            </div>
            <div id="mmo-color-selected" style="font-size:11px;color:var(--text3);margin-top:5px">เลือกสีที่จะแสดงใน Minecraft</div>
          </div>

          <div style="font-size:10px;color:var(--text3);margin-top:6px">ID: <span id="node-id-display"></span></div>
        </div>

        <div class="panel-section">
          <h3>Stats</h3>
          <div id="stat-list"></div>
          <div style="display:flex;gap:6px;margin-top:6px">
            <button class="btn sm" id="add-stat-btn" style="flex:1">+ เพิ่ม Stat</button>
            <button class="btn sm gold" id="btn-randomize-stat" title="สุ่ม stat">🎲 สุ่ม</button>
          </div>
        </div>

        <div class="panel-section panel-scroll" id="parent-section">
          <h3>Parent Nodes</h3>
          <div style="font-size:11px;color:var(--text3);margin-bottom:8px">
            ต้องอัพ node เหล่านี้ครบก่อนถึงจะ unlock node นี้ได้
          </div>
          <div id="parent-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/stats.js"></script>
<script src="js/tree.js"></script>
<script src="js/node_names.js"></script>
<script src="js/mmocore_exporter.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
